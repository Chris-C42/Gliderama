<!doctype html>
<!--
  Audio Lab: a dev page for the chiptune engine (not part of the production build).
  Run `npm run dev` and open /audio-lab.html. See src/audio/README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2b2340" />
    <title>Gliderama Audio Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1630;
        --panel: #2b2340;
        --panel-2: #362c52;
        --line: #4a3d70;
        --text: #efe9ff;
        --dim: #a99cc9;
        --accent: #ffd166;
        --ok: #06d6a0;
        --bad: #ef476f;
        --info: #8ecae6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      main { max-width: 1000px; margin: 0 auto; display: grid; gap: 14px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; color: var(--accent); }
      h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
      section { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 12px 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 2px solid var(--line);
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover { border-color: var(--accent); }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--accent); color: #2b2340; border-color: var(--accent); font-weight: 700; }
      button.on { background: var(--ok); color: #10202a; border-color: var(--ok); font-weight: 700; }
      button.flash-bad { border-color: var(--bad); background: #5a2740; }
      button .sub { display: block; font-size: 10px; color: var(--dim); }
      button.on .sub { color: #1b3a44; }
      label.slider { display: grid; grid-template-columns: 96px 1fr 56px; gap: 8px; align-items: center; min-width: 290px; flex: 1 1 290px; }
      label.slider output { text-align: right; color: var(--accent); }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
      textarea {
        width: 100%;
        min-height: 260px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        background: #14102a;
        color: var(--text);
        border: 2px solid var(--line);
        border-radius: 4px;
        padding: 8px;
        resize: vertical;
        tab-size: 2;
      }
      .status { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); }
      .status b { color: var(--text); font-weight: 600; }
      .pill { padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
      .pill.running { color: var(--ok); border-color: var(--ok); }
      .pill.none, .pill.suspended { color: var(--bad); border-color: var(--bad); }
      canvas#meter { width: 100%; height: 22px; background: #14102a; border: 2px solid var(--line); border-radius: 4px; display: block; }
      .progress { height: 8px; background: #14102a; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); flex: 1 1 200px; }
      .progress > i { display: block; height: 100%; width: 0; background: var(--info); }
      .loop-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 10px; align-items: center; padding: 4px 0; border-top: 1px dashed var(--line); }
      .loop-row:first-of-type { border-top: 0; }
      pre#log { margin: 0; max-height: 220px; overflow: auto; background: #14102a; border: 2px solid var(--line); border-radius: 4px; padding: 8px; font-size: 12px; white-space: pre-wrap; }
      .log-warn { color: var(--accent); }
      .log-error { color: var(--bad); }
      .log-ok { color: var(--ok); }
      #editor-msg { margin-top: 8px; white-space: pre-wrap; }
      #editor-msg.bad { color: var(--bad); }
      #editor-msg.ok { color: var(--ok); }
      .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
      @media (max-width: 640px) {
        .loop-row { grid-template-columns: 1fr; }
        label.slider { grid-template-columns: 80px 1fr 52px; }
      }
    </style>
  </head>
  <body>
    <main id="lab"><h1>Audio Lab</h1><p>Loading…</p></main>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
</html>
